[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    rest: REST API Endpoints tests
    graphql: GraphQL Queries and Mutations tests
    p1_blocker: Critical P1 blocker severity
    p2_critical: High P2 critical severity
    p3_major: Medium P3 major severity
    p4_minor: Low P4 minor severity
    jira: Jira defect tracking marker with severity
